benchmark_ticker: 'NIFTY 50'
benchmark_universe_tickers: []

feature_toggles:
  candle: true
  trend: true
  volatility: true
  volume: true
  relative_strength: true
  structure: true
  market_regime: true
  multi_timeframe: true

windows:
  short: 10
  medium: 20
  long: 50
  very_long: 200
  yearly: 252

thresholds:
  expansion_range_multiplier: 1.5
  contraction_range_multiplier: 0.7
  atr_compression_threshold: 0.8
  atr_expansion_threshold: 1.2
  relative_volume_spike_threshold: 2.0
  volatility_expansion_threshold: 1.4

targets:
  future_return_targets:
    - threshold_pct: 10.0
      lookahead_days: 20
    - threshold_pct: 15.0
      lookahead_days: 30
    - threshold_pct: 25.0
      lookahead_days: 60
  breakout_target:
    lookahead_days: 20
    yearly_high_window: 252
    expansion_threshold: 1.25
  volatility_target:
    lookahead_days: 20
    realized_vol_window: 20
    expansion_threshold: 1.4
  momentum_target:
    lookahead_days: 20
    min_return_pct: 5.0
    max_drawdown_pct: -3.0

dataset:
  start_date: null
  end_date: null
  daily_timeframe: '1DAY'
  weekly_timeframe: '1WEEK'
  monthly_timeframe: '1MONTH'
  min_history_rows: 260
  dropna_feature_threshold: 0.5
  output_dir: './artifacts/analysis'
  output_prefix: 'quant_feature_dataset'
  export_csv: true
  export_parquet: false

regime:
  volatility_window: 20
  trend_window: 50
  breadth_window: 20
  panic_vol_zscore: 1.2
  choppy_trend_abs_threshold: 0.015
  expansion_momentum_threshold: 0.05
  clustering_enabled: false
  clustering_regimes: 4

model:
  model_types: ['xgb', 'lgb', 'rf']
  target_column: 'target_up_10pct_within_20d'
  walk_forward_train_days: 365
  walk_forward_test_days: 90
  walk_forward_step_days: 90
  min_train_rows: 1000
  min_test_rows: 100
  probability_threshold: 0.55
  calibration_enabled: true
  calibration_method: 'sigmoid'
  calibration_fraction: 0.2
  calibration_min_rows: 200
  threshold_optimization_enabled: true
  threshold_search_min: 0.4
  threshold_search_max: 0.8
  threshold_search_step: 0.02
  threshold_objective: 'f1'
  random_state: 42
