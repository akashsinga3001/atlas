services:
  celery-worker:
    build: ./backend
    container_name: atlas-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - ./backend:/app
    networks:
      - shared-infra

  celery-beat:
    build: ./backend
    container_name: atlas-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - ./backend:/app
    networks:
      - shared-infra

networks:
  shared-infra:
    external: true
    name: shared-infra
