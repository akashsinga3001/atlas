services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./backend:/app
    networks:
      - shared-infra
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: ./backend
    container_name: atlas-worker
    restart: unless-stopped
    command: watchmedo auto-restart --directory=/app --pattern=*.py --recursive -- celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - ./backend:/app
    networks:
      - shared-infra

  celery-beat:
    build: ./backend
    container_name: atlas-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info -S redbeat.RedBeatScheduler
    env_file:
      - .env.docker
    volumes:
      - ./backend:/app
    networks:
      - shared-infra

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - shared-infra
    command: npm run dev

networks:
  shared-infra:
    external: true
    name: shared-infra
